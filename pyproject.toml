[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmzip_extension"
version = "0.1.0"
description = "Research project for LLMzip extension and GRC"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "numpy",
    "transformers",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "experiments*", "utils*"]
