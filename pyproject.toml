[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gendiff"
version = "0.1.0"
description = "Research project for LLMzip-based generative reconstruction compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "transformers",
    "accelerate",
    "pydantic",
    "matplotlib",
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "experiments", "utils"]
